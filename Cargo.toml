[package]
name = "folio-fold"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
license = "Unlicense"
description = "Native PDF imposition and signature layout for physical bookbinding."
readme = "README.md"
repository = "https://github.com/asdw2747/folio-fold"
homepage = "https://github.com/asdw2747/folio-fold"
keywords = ["pdf", "imposition", "bookbinding", "signature", "booklet"]
categories = ["graphics", "gui"]

[lib]
name = "folio_fold"
path = "src/lib.rs"

[[bin]]
name = "folio-fold"
path = "src/main.rs"

[dependencies]
anyhow = "1"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
lopdf = { version = "0.47", default-features = false }
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
tempfile = "3"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
